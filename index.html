<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRASANTH</title>
<meta name="description" content="PRASANTH — an animated name in light.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='%2300f0ff'/><stop offset='1' stop-color='%23ff2bd6'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%2305060f'/><text x='50%' y='54%' text-anchor='middle' dominant-baseline='middle' font-family='Arial Black,sans-serif' font-size='40' fill='url(%23g)'>P</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060f;
    --cyan: #00f0ff;
    --pink: #ff2bd6;
    --violet: #7c4dff;
    --muted: #9fb3c8;
    --mono: 'Share Tech Mono', 'Courier New', monospace;
    --display: 'Orbitron', 'Arial Black', Impact, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #fff;
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  @media (pointer: fine) {
    body, button { cursor: none; }
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { z-index: 0; }
  #glow {
    z-index: 1;
    pointer-events: none;
    filter: blur(10px) saturate(1.6);
    mix-blend-mode: screen;
    opacity: .9;
  }

  .vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .8) 100%);
  }
  .scan {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }

  /* ---------- Header ---------- */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: clamp(14px, 3vh, 28px) clamp(16px, 4vw, 40px);
    font: 400 .72rem var(--mono);
    letter-spacing: .3em;
    color: var(--muted);
    opacity: 0;
    transition: opacity 1s .4s;
  }
  body.ready .top { opacity: 1; }
  .brand { display: flex; align-items: center; gap: .8em; color: #fff; }
  .logo {
    width: 10px; height: 10px; transform: rotate(45deg);
    background: linear-gradient(135deg, var(--cyan), var(--pink));
    box-shadow: 0 0 12px var(--cyan);
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(405deg); } }
  kbd {
    font: inherit; font-size: .65rem; letter-spacing: 0;
    padding: .15em .45em; margin: 0 .15em;
    border: 1px solid rgba(255, 255, 255, .18); border-radius: 4px;
    color: #fff;
  }
  @media (max-width: 720px) { .hint { display: none; } }

  /* ---------- Scenes ---------- */
  .scene {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0; visibility: hidden;
    transition: opacity .8s ease, visibility .8s;
  }
  .scene.active { opacity: 1; visibility: visible; }

  .caption {
    font: 400 clamp(.68rem, 1.3vw, .95rem) var(--mono);
    letter-spacing: .6em;
    text-indent: .6em;
    color: var(--muted);
    text-align: center;
    opacity: 0;
  }
  body.ready .scene.active .caption { animation: spread 1.6s ease forwards; }
  @keyframes spread {
    from { opacity: 0; letter-spacing: 1.4em; text-indent: 1.4em; filter: blur(6px); }
    to   { opacity: .85; letter-spacing: .6em; text-indent: .6em; filter: blur(0); }
  }

  /* Swarm (the name itself lives on the canvas) */
  .swarm .caption { position: absolute; left: 0; right: 0; }
  .swarm .pre  { top: calc(46% - var(--ns, 200px) * .5 - 3.2em); animation-delay: 1.2s !important; }
  .swarm .post { top: calc(46% + var(--ns, 200px) * .5 + 2.2em); animation-delay: 1.6s !important; }
  .swarm .post b { color: var(--cyan); font-weight: 400; }

  /* Neon */
  .neon-wrap { perspective: 900px; }
  .neon {
    display: flex;
    font-weight: 900;
    font-size: clamp(2.6rem, 13vw, 10.5rem);
    letter-spacing: .04em;
    line-height: 1;
    transition: transform .25s ease-out;
    -webkit-box-reflect: below .06em linear-gradient(transparent 50%, rgba(255, 255, 255, .22));
  }
  .neon span {
    --c: hsl(var(--h) 100% 60%);
    display: inline-block;
    color: #fff;
    opacity: 0;
    transform-origin: 50% 100%;
    text-shadow:
      0 0 .02em #fff,
      0 0 .08em var(--c),
      0 0 .2em var(--c),
      0 0 .45em var(--c),
      0 0 .9em var(--c);
  }
  .scene.active .neon span {
    animation:
      flipIn 1.1s cubic-bezier(.2, 1.4, .4, 1) calc(var(--i) * .09s) forwards,
      bob 3.2s ease-in-out calc(1.2s + var(--i) * .18s) infinite,
      flicker 7s steps(1, end) calc(2s + var(--i) * .83s) infinite;
  }
  @keyframes flipIn {
    0%   { opacity: 0; transform: perspective(600px) rotateX(-110deg) translateY(.4em); filter: blur(8px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -.08em; } }
  @keyframes flicker {
    0%, 100% { filter: none; }
    2% { filter: brightness(.35); }
    3% { filter: none; }
    5% { filter: brightness(.5); }
    6% { filter: none; }
  }
  .neon-wrap + .caption { margin-top: clamp(4rem, 15vh, 9rem); animation-delay: 1.2s !important; }

  /* Decode */
  .frame { position: relative; padding: clamp(1rem, 3vw, 2rem) clamp(1.2rem, 4vw, 3rem); }
  .frame .c {
    position: absolute; width: 22px; height: 22px;
    border: 2px solid var(--cyan);
    filter: drop-shadow(0 0 6px var(--cyan));
  }
  .c.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .c.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .c.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .c.br { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  .scene.active .frame .c { animation: cornerIn .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes cornerIn { from { opacity: 0; transform: scale(2.4); } }
  .meta {
    position: absolute;
    font: 400 clamp(.5rem, 1vw, .66rem) var(--mono);
    letter-spacing: .2em;
    color: var(--cyan);
    opacity: .7;
    white-space: nowrap;
  }
  .meta.tm { top: -1.8em; left: 0; }
  .meta.bm { bottom: -1.8em; right: 0; }
  .meta .live { color: #7dffb0; animation: blink 1.2s steps(1) infinite; }

  .glitch {
    position: relative;
    font-family: var(--mono);
    font-size: clamp(2.6rem, 13vw, 10rem);
    line-height: 1;
    letter-spacing: .06em;
    color: #eaffff;
    white-space: nowrap;
    text-shadow: 2px 0 rgba(255, 43, 214, .7), -2px 0 rgba(0, 240, 255, .7), 0 0 30px rgba(0, 240, 255, .35);
  }
  .glitch .dud { color: var(--cyan); opacity: .75; }
  .glitch .dud.dim { opacity: .3; }
  .glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    text-shadow: none;
    pointer-events: none;
  }
  .glitch::before { color: var(--cyan); animation: gA 2.8s infinite steps(1, end); }
  .glitch::after  { color: var(--pink); animation: gB 3.3s infinite steps(1, end); }
  .glitch.locked { animation: skew 4s infinite steps(1, end); }
  @keyframes gA {
    0%, 8%, 100% { clip-path: inset(100% 0 0 0); transform: none; }
    1% { clip-path: inset(10% 0 70% 0); transform: translate(-6px, -2px); }
    3% { clip-path: inset(55% 0 20% 0); transform: translate(5px, 1px); }
    5% { clip-path: inset(30% 0 45% 0); transform: translate(-3px, 2px); }
    7% { clip-path: inset(80% 0 5% 0);  transform: translate(4px, -1px); }
  }
  @keyframes gB {
    0%, 50%, 60%, 100% { clip-path: inset(100% 0 0 0); transform: none; }
    51% { clip-path: inset(65% 0 10% 0); transform: translate(6px, 2px); }
    54% { clip-path: inset(5% 0 80% 0);  transform: translate(-5px, -1px); }
    57% { clip-path: inset(40% 0 35% 0); transform: translate(3px, 1px); }
  }
  @keyframes skew {
    0%, 90%, 100% { transform: none; }
    91% { transform: skewX(8deg); }
    92% { transform: skewX(-4deg) translateX(4px); }
    93% { transform: none; }
  }
  .typed {
    margin-top: clamp(1.6rem, 5vh, 2.6rem);
    min-height: 1.4em;
    font: 400 clamp(.7rem, 1.6vw, 1rem) var(--mono);
    letter-spacing: .15em;
    color: #7dffb0;
    text-shadow: 0 0 8px rgba(125, 255, 176, .6);
  }
  .typed::after { content: '\2588'; margin-left: .2em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Nav ---------- */
  nav {
    position: fixed; left: 50%; bottom: clamp(14px, 4vh, 32px); z-index: 10;
    transform: translateX(-50%);
    display: flex; gap: 4px; padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .1);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    transition: opacity 1s .6s;
  }
  body.ready nav { opacity: 1; }
  nav button {
    position: relative; overflow: hidden;
    font: 500 clamp(.56rem, 1.6vw, .72rem)/1 var(--display);
    letter-spacing: .15em;
    text-transform: uppercase;
    color: #8b9bb0;
    background: transparent;
    border: 0;
    padding: .9em 1.2em;
    border-radius: 999px;
    transition: color .3s, background .3s;
  }
  nav button b { color: var(--cyan); font-weight: 500; margin-right: .4em; opacity: .7; }
  nav button:hover, nav button.active, #autoBtn.on { color: #fff; }
  nav button.active {
    background: linear-gradient(90deg, rgba(0, 240, 255, .18), rgba(255, 43, 214, .18));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
  }
  #autoBtn .prog {
    position: absolute; left: 0; bottom: 0; height: 2px;
    width: calc(var(--p, 0) * 100%);
    background: linear-gradient(90deg, var(--cyan), var(--pink));
  }
  .sep { width: 1px; margin: 6px 2px; background: rgba(255, 255, 255, .12); }
  @media (max-width: 480px) { nav button b { display: none; } }

  /* ---------- Intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, rgba(5, 6, 15, .7), var(--bg) 70%);
    transition: opacity .8s ease, transform .8s ease, visibility .8s;
  }
  #intro.done { opacity: 0; visibility: hidden; transform: scale(1.1); }
  .intro-inner { text-align: center; }
  .count {
    font-size: clamp(3rem, 10vw, 6rem); font-weight: 900;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .bar { width: min(320px, 60vw); height: 2px; margin: 1rem auto; overflow: hidden; background: rgba(255, 255, 255, .1); }
  .bar i {
    display: block; width: 0; height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    box-shadow: 0 0 12px var(--cyan);
  }
  .label { font: 400 .72rem var(--mono); letter-spacing: .5em; text-indent: .5em; color: #7f93a8; }

  /* ---------- Cursor ---------- */
  .cursor-dot, .cursor-ring {
    position: fixed; left: 0; top: 0; z-index: 100;
    border-radius: 50%; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  body.moved .cursor-dot, body.moved .cursor-ring { opacity: 1; }
  .cursor-dot {
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    background: #fff;
    box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan);
  }
  .cursor-ring {
    width: 36px; height: 36px; margin: -18px 0 0 -18px;
    border: 1px solid rgba(0, 240, 255, .6);
    transition: opacity .3s, width .25s, height .25s, margin .25s, border-color .25s;
  }
  body.hovering .cursor-ring { width: 60px; height: 60px; margin: -30px 0 0 -30px; border-color: var(--pink); }
  @media (pointer: coarse) { .cursor-dot, .cursor-ring { display: none; } }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <canvas id="glow"></canvas>

  <section class="scene swarm" data-scene="swarm">
    <p class="caption pre">HELLO, I AM</p>
    <p class="caption post">MADE OF <b id="pcount">0</b> POINTS OF LIGHT</p>
  </section>

  <section class="scene" data-scene="neon">
    <div class="neon-wrap"><h1 class="neon" id="neon" aria-label="PRASANTH"></h1></div>
    <p class="caption">&mdash; NAME IN LIGHTS &mdash;</p>
  </section>

  <section class="scene" data-scene="decode">
    <div class="frame">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <span class="meta tm">ID // 0x50 52 41 53 41 4E 54 48</span>
      <h1 class="glitch" id="decodeName" data-text="PRASANTH">PRASANTH</h1>
      <span class="meta bm">STATUS: <span class="live">&#9679; ONLINE</span></span>
    </div>
    <p class="typed" id="typed"></p>
  </section>

  <div class="vignette"></div>
  <div class="scan"></div>

  <header class="top">
    <div class="brand"><span class="logo"></span>PRASANTH</div>
    <div class="hint">MOVE &middot; CLICK &middot; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> &middot; <kbd>SPACE</kbd> &middot; <kbd>A</kbd></div>
  </header>

  <nav id="nav">
    <button data-go="swarm"><b>01</b>Swarm</button>
    <button data-go="neon"><b>02</b>Neon</button>
    <button data-go="decode"><b>03</b>Decode</button>
    <span class="sep"></span>
    <button id="autoBtn"><i class="prog"></i>Auto</button>
  </nav>

  <div id="intro">
    <div class="intro-inner">
      <div class="count" id="count">0</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="label">INITIALIZING</div>
    </div>
  </div>

  <div class="cursor-ring" id="ring"></div>
  <div class="cursor-dot" id="dot"></div>

<script>
(() => {
  'use strict';

  const NAME = 'PRASANTH';
  const FONT = "'Orbitron','Arial Black',Impact,sans-serif";
  const SCENES = ['swarm', 'neon', 'decode'];
  const DURATION = { swarm: 13000, neon: 9000, decode: 9000 };
  const BUCKETS = 28;
  const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%*+=?/\\|_';

  const $ = (s) => document.querySelector(s);
  const canvas = $('#fx'), ctx = canvas.getContext('2d');
  const glow = $('#glow'), gctx = glow.getContext('2d');
  const root = document.documentElement;
  const body = document.body;
  const neonEl = $('#neon'), decodeEl = $('#decodeName'), typedEl = $('#typed');
  const autoBtn = $('#autoBtn'), navBtns = [...document.querySelectorAll('nav [data-go]')];
  const dot = $('#dot'), ring = $('#ring');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1, nameSize = 200, gap = 6;
  let particles = [], stars = [], rings = [];
  let mode = 'form', modeStart = 0, modeUntil = 0;
  let scene = 'swarm', sceneStart = 0, auto = !reduceMotion, started = false;
  let warp = 1;
  const mouse = { x: -9999, y: -9999, active: false };
  const ringPos = { x: 0, y: 0 };

  const rand = (a, b) => a + Math.random() * (b - a);
  const shuffle = (a) => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  neonEl.innerHTML = [...NAME]
    .map((ch, i) => `<span style="--i:${i};--h:${185 + i * 20}">${ch}</span>`)
    .join('');

  /* ---------- Setup ---------- */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#05060f';
    ctx.fillRect(0, 0, W, H);
    glow.width = Math.ceil(W / 4);
    glow.height = Math.ceil(H / 4);
    buildStars();
    buildTargets();
  }

  function newStar(anyDepth) {
    return { x: rand(-1, 1), y: rand(-1, 1), z: anyDepth ? rand(0.05, 1) : 1 };
  }

  function buildStars() {
    const n = Math.round(Math.min(420, (W * H) / 4000));
    stars = Array.from({ length: n }, () => newStar(true));
  }

  function makeParticle() {
    return {
      x: W / 2, y: H * 0.46, vx: 0, vy: 0, tx: 0, ty: 0, b: 0,
      k: rand(0.018, 0.045), s: rand(0.55, 1.1), a: rand(0, Math.PI * 2), r: Math.random(),
    };
  }

  function buildTargets() {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const o = off.getContext('2d', { willReadFrequently: true });

    let size = Math.min(W * 0.2, H * 0.36);
    o.font = `900 ${size}px ${FONT}`;
    const textW = o.measureText(NAME).width;
    if (textW > W * 0.9) {
      size *= (W * 0.9) / textW;
      o.font = `900 ${size}px ${FONT}`;
    }
    nameSize = size;
    root.style.setProperty('--ns', size + 'px');

    o.textAlign = 'center';
    o.textBaseline = 'middle';
    o.fillStyle = '#fff';
    o.fillText(NAME, W / 2, H * 0.46);

    gap = Math.max(3, Math.round(size / 46));
    const data = o.getImageData(0, 0, W, H).data;
    let pts = [], minX = W, maxX = 0;
    for (let y = 0; y < H; y += gap) {
      for (let x = 0; x < W; x += gap) {
        if (data[(y * W + x) * 4 + 3] > 140) {
          pts.push({ x, y });
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
        }
      }
    }
    const max = W < 700 ? 1800 : 5000;
    pts = shuffle(pts).slice(0, max);

    while (particles.length < pts.length) particles.push(makeParticle());
    particles.length = pts.length;
    const span = Math.max(1, maxX - minX);
    pts.forEach((pt, i) => {
      const p = particles[i];
      p.tx = pt.x; p.ty = pt.y;
      p.b = Math.min(BUCKETS - 1, Math.floor(((pt.x - minX) / span) * BUCKETS));
    });
    $('#pcount').textContent = particles.length.toLocaleString();
  }

  /* ---------- Effects ---------- */

  function setMode(m, now = performance.now()) {
    mode = m;
    modeStart = now;
  }

  function burst(x, y, power) {
    const reach = Math.max(W, H) * 0.6;
    for (const p of particles) {
      const dx = p.x - x, dy = p.y - y;
      const d = Math.hypot(dx, dy) || 1;
      const s = power * (0.4 + Math.random()) * Math.max(0.15, 1 - d / reach);
      p.vx += (dx / d) * s;
      p.vy += (dy / d) * s;
    }
    rings.push({ x, y, r: 0, max: Math.max(W, H) * 0.5, life: 1 });
  }

  function explodeAt(x, y, power) {
    burst(x, y, power);
    if (scene === 'swarm') {
      setMode('explode');
      modeUntil = performance.now() + 900;
    }
  }

  function bigBang() {
    const now = performance.now();
    for (const p of particles) {
      const ang = rand(0, Math.PI * 2), sp = rand(5, 28);
      p.x = W / 2; p.y = H * 0.46;
      p.vx = Math.cos(ang) * sp;
      p.vy = Math.sin(ang) * sp;
    }
    setMode('explode', now);
    modeUntil = now + 700;
    rings.push({ x: W / 2, y: H * 0.46, r: 0, max: Math.max(W, H) * 0.6, life: 1 });
  }

  /* ---------- Scenes ---------- */

  function setAuto(on) {
    auto = on;
    autoBtn.classList.toggle('on', on);
    sceneStart = performance.now();
  }

  function go(name, fromAuto = false) {
    if (!fromAuto && auto) setAuto(false);
    if (name === scene && started) {
      if (name === 'decode') runDecode();
      return;
    }
    scene = name;
    sceneStart = performance.now();
    document.querySelectorAll('.scene').forEach((s) => s.classList.toggle('active', s.dataset.scene === name));
    navBtns.forEach((b) => b.classList.toggle('active', b.dataset.go === name));
    neonEl.style.transform = '';

    if (name === 'swarm') {
      setMode('form');
    } else {
      burst(W / 2, H * 0.46, 8);
      setMode('drift');
    }
    if (name === 'decode') runDecode();
  }

  let decodeRaf = 0, typeTimer = 0, decodeLoop = 0;

  function runDecode() {
    cancelAnimationFrame(decodeRaf);
    clearTimeout(typeTimer);
    clearTimeout(decodeLoop);
    typedEl.textContent = '';
    decodeEl.classList.remove('locked');

    const queue = [...NAME].map((ch, i) => ({
      to: ch,
      start: ((Math.random() * 12) | 0) + i * 2,
      end: ((Math.random() * 20) | 0) + 24 + i * 5,
      ch: '',
    }));
    let frame = 0;

    const step = () => {
      let html = '', plain = '', done = 0;
      for (const c of queue) {
        if (frame >= c.end) {
          done++;
          html += c.to;
          plain += c.to;
        } else {
          if (!c.ch || Math.random() < 0.3) c.ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
          html += `<span class="dud${frame < c.start ? ' dim' : ''}">${c.ch}</span>`;
          plain += c.ch;
        }
      }
      decodeEl.innerHTML = html;
      decodeEl.dataset.text = plain;
      if (done < queue.length) {
        frame++;
        decodeRaf = requestAnimationFrame(step);
      } else {
        decodeEl.classList.add('locked');
        typeOut(`> ACCESS GRANTED :: WELCOME, ${NAME}`);
      }
    };
    step();
  }

  function typeOut(text, i = 0) {
    typedEl.textContent = text.slice(0, i);
    if (i < text.length) {
      typeTimer = setTimeout(() => typeOut(text, i + 1), 35);
    } else {
      decodeLoop = setTimeout(() => { if (scene === 'decode') runDecode(); }, 3500);
    }
  }

  /* ---------- Simulation ---------- */

  function tick(now, f) {
    if (started) {
      if (mode === 'explode' && now > modeUntil) setMode(scene === 'swarm' ? 'form' : 'drift', now);
      if (scene === 'swarm') {
        if (mode === 'form' && now - modeStart > 7500) setMode('vortex', now);
        else if (mode === 'vortex' && now - modeStart > 2800) setMode('form', now);
      }
      if (auto && now - sceneStart > DURATION[scene]) {
        go(SCENES[(SCENES.indexOf(scene) + 1) % SCENES.length], true);
      }
      autoBtn.style.setProperty('--p', auto ? Math.min(1, (now - sceneStart) / DURATION[scene]) : 0);
    }

    const targetWarp = mode === 'explode' ? 6 : mode === 'vortex' ? 3 : 1;
    warp += (targetWarp - warp) * 0.05 * f;
    const sp = 0.0035 * warp * f;
    for (const s of stars) {
      s.z -= sp;
      if (s.z <= 0.03) Object.assign(s, newStar(false));
    }

    for (const r of rings) {
      r.r += (r.max - r.r) * 0.08 * f;
      r.life -= 0.02 * f;
    }
    rings = rings.filter((r) => r.life > 0);

    if (!started) return;

    const fric = Math.pow(mode === 'explode' ? 0.955 : mode === 'drift' ? 0.97 : 0.86, f);
    const R = Math.max(90, nameSize * 0.45), R2 = R * R;
    const repel = mode === 'drift' ? 0.6 : 4;
    const cx = W / 2, cy = H * 0.46, minWH = Math.min(W, H);

    for (const p of particles) {
      let ax = 0, ay = 0;
      if (mode === 'form') {
        const jx = Math.sin(now * 0.002 + p.a * 7) * 0.6;
        const jy = Math.cos(now * 0.0017 + p.a * 5) * 0.6;
        ax = (p.tx + jx - p.x) * p.k;
        ay = (p.ty + jy - p.y) * p.k;
      } else if (mode === 'vortex') {
        const ang = p.a + now * 0.0015 * (0.6 + p.r);
        const rad = minWH * (0.08 + p.r * 0.34);
        ax = (cx + Math.cos(ang) * rad - p.x) * 0.03;
        ay = (cy + Math.sin(ang) * rad * 0.6 - p.y) * 0.03;
      } else if (mode === 'drift') {
        ax = Math.sin(now * 0.0004 + p.a * 3) * 0.05;
        ay = Math.cos(now * 0.00035 + p.r * 9) * 0.05 - 0.01;
      }

      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < R2 && d2 > 0.01) {
          const d = Math.sqrt(d2), s = (1 - d / R) * repel;
          ax += (dx / d) * s;
          ay += (dy / d) * s;
        }
      }

      p.vx = (p.vx + ax * f) * fric;
      p.vy = (p.vy + ay * f) * fric;
      p.x += p.vx * f;
      p.y += p.vy * f;

      if (mode === 'drift') {
        if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      }
    }
  }

  function draw(now) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 6, 15, 0.3)';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2, scale = Math.max(W, H) * 0.5;
    ctx.fillStyle = 'rgba(200, 220, 255, 0.85)';
    ctx.beginPath();
    for (const s of stars) {
      const x = cx + (s.x * scale) / s.z, y = cy + (s.y * scale) / s.z;
      if (x < 0 || x > W || y < 0 || y > H) { Object.assign(s, newStar(false)); continue; }
      const sz = (1 - s.z) * 1.8 + 0.2;
      ctx.rect(x, y, sz, sz);
    }
    ctx.fill();

    if (started) {
      const paths = Array.from({ length: BUCKETS }, () => new Path2D());
      const base = gap * 0.55;
      for (const p of particles) {
        const s = base * p.s;
        paths[p.b].rect(p.x - s / 2, p.y - s / 2, s, s);
      }
      for (let b = 0; b < BUCKETS; b++) {
        const h = 185 + (b / (BUCKETS - 1)) * 140 + Math.sin(now * 0.0008 - b * 0.25) * 25;
        ctx.fillStyle = `hsl(${h}, 100%, 62%)`;
        ctx.fill(paths[b]);
      }
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const r of rings) {
      ctx.strokeStyle = `rgba(120, 220, 255, ${r.life})`;
      ctx.lineWidth = 2 * r.life + 0.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (mouse.active) {
      const R = Math.max(90, nameSize * 0.45);
      const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, R);
      g.addColorStop(0, 'rgba(124, 77, 255, 0.12)');
      g.addColorStop(1, 'rgba(124, 77, 255, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(mouse.x - R, mouse.y - R, R * 2, R * 2);
    }

    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.drawImage(canvas, 0, 0, glow.width, glow.height);
  }

  let last = performance.now();
  function loop(now) {
    const f = Math.min(now - last, 50) / 16.667;
    last = now;
    tick(now, f);
    draw(now);

    ringPos.x += (mouse.x - ringPos.x) * 0.18 * f;
    ringPos.y += (mouse.y - ringPos.y) * 0.18 * f;
    ring.style.transform = `translate3d(${ringPos.x}px, ${ringPos.y}px, 0)`;

    requestAnimationFrame(loop);
  }

  /* ---------- Input ---------- */

  addEventListener('pointermove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    if (!body.classList.contains('moved')) {
      body.classList.add('moved');
      ringPos.x = mouse.x; ringPos.y = mouse.y;
    }
    dot.style.transform = `translate3d(${mouse.x}px, ${mouse.y}px, 0)`;
    if (scene === 'neon') {
      const rx = (0.5 - mouse.y / H) * 18, ry = (mouse.x / W - 0.5) * 26;
      neonEl.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }
  });

  document.addEventListener('mouseout', (e) => {
    if (!e.relatedTarget) { mouse.active = false; body.classList.remove('moved'); }
  });

  addEventListener('pointerup', (e) => {
    if (e.pointerType === 'touch') mouse.active = false;
  });

  addEventListener('pointerdown', (e) => {
    if (!started || e.target.closest('nav')) return;
    explodeAt(e.clientX, e.clientY, 14);
  });

  document.addEventListener('pointerover', (e) => {
    body.classList.toggle('hovering', !!e.target.closest('button'));
  });

  navBtns.forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
  autoBtn.addEventListener('click', () => setAuto(!auto));

  addEventListener('keydown', (e) => {
    if (!started) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= SCENES.length) go(SCENES[n - 1]);
    else if (e.key === ' ') { e.preventDefault(); explodeAt(W / 2, H * 0.46, 18); }
    else if (e.key.toLowerCase() === 'a') setAuto(!auto);
  });

  let resizeTimer = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  /* ---------- Boot ---------- */

  function runIntro() {
    const countEl = $('#count'), barEl = $('#bar');
    const t0 = performance.now(), dur = reduceMotion ? 300 : 1600;
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      countEl.textContent = Math.round(e * 100);
      barEl.style.width = e * 100 + '%';
      if (t < 1) requestAnimationFrame(step);
      else {
        $('#intro').classList.add('done');
        setTimeout(start, 350);
      }
    };
    requestAnimationFrame(step);
  }

  function start() {
    go('swarm', true);
    started = true;
    autoBtn.classList.toggle('on', auto);
    sceneStart = performance.now();
    body.classList.add('ready');
    bigBang();
  }

  async function init() {
    if (document.fonts) {
      const fonts = Promise.all([
        document.fonts.load(`900 100px Orbitron`),
        document.fonts.load(`400 20px 'Share Tech Mono'`),
      ]);
      await Promise.race([fonts, new Promise((r) => setTimeout(r, 2500))]).catch(() => {});
    }
    resize();
    requestAnimationFrame(loop);
    runIntro();
  }

  init();
})();
</script>
</body>
</html>
